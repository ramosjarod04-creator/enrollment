{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 100px auto; text-align: center; padding: 10px;">
    <div style="background: white; padding: 50px; border-radius: 35px; border: 1px solid #fee2e2; box-shadow: 0 15px 30px rgba(239, 68, 68, 0.05);">
        <div style="font-size: 4rem; margin-bottom: 20px;">⚠️</div>
        <h1 style="color: #0a1969; font-weight: 800; margin-bottom: 15px;">Are you sure?</h1>
        <p style="color: #64748b; line-height: 1.6; margin-bottom: 30px;">
            You are about to delete <strong>{{ program.name }}</strong>. This action is permanent and cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 15px;">
                <button type="submit" style="flex-grow: 1; background: #ef4444; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 800; cursor: pointer;">Confirm Delete</button>
                <a href="{% url 'program_detail' program.pk %}" style="flex-grow: 1; background: #f1f5f9; color: #64748b; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: 800;">Keep Program</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

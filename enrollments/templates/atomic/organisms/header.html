<div style="padding: 40px 20px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box;">
    
    <div style="margin-bottom: 50px; text-align: center;">
        <h2 style="font-size: 1.4rem; margin: 0; font-weight: 800; color: white; letter-spacing: 0.5px;">Enrollment System</h2>
    </div>

    <ul style="list-style: none; padding: 0; margin: 0; flex-grow: 1;">
        
        <li style="margin-bottom: 12px;">
            <a href="{% url 'dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active-nav{% endif %}">
                Dashboard
            </a>
        </li>

        <li style="margin-bottom: 12px;">
            <a href="{% url 'program_list' %}" class="nav-item {% if request.resolver_match.url_name == 'program_list' %}active-nav{% endif %}">
                Courses
            </a>
        </li>

        <li style="margin-bottom: 12px;">
            <a href="{% url 'enrollment_list' %}" class="nav-item {% if request.resolver_match.url_name == 'enrollment_list' %}active-nav{% endif %}">
                Enrollment
            </a>
        </li>

        {% if user.is_staff %}
        <li style="margin-bottom: 12px;">
            <a href="{% url 'program_create' %}" class="nav-item {% if request.resolver_match.url_name == 'program_create' %}active-nav{% endif %}">
                Add Course
            </a>
        </li>
        {% endif %}

        <li style="margin-bottom: 12px;">
            <a href="{% url 'student_profile' %}" class="nav-item {% if request.resolver_match.url_name == 'student_profile' %}active-nav{% endif %}">
                Profile
            </a>
        </li>
    </ul>

    <div style="margin-top: auto; padding-bottom: 10px; text-align: center;">
        <a href="{% url 'logout' %}" style="text-decoration: none; color: white; font-weight: 800; font-size: 1.1rem; opacity: 0.9;">Log out</a>
    </div>
</div>

<style>
    /* Navigation Link Base Styling */
    .nav-item {
        text-decoration: none; 
        display: block; 
        padding: 12px; 
        border-radius: 15px; 
        text-align: center; 
        font-size: 1rem; 
        transition: 0.3s;
        color: white; 
        font-weight: 600; 
        opacity: 0.9;
    }
    
    /* Active State (uses CSS variables from your base template) */
    .active-nav {
        color: var(--active-nav-text) !important; 
        background: var(--active-nav-bg) !important; 
        font-weight: 800 !important;
        opacity: 1 !important;
    }

    /* Hover Effect */
    .nav-item:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.1);
    }
</style>
